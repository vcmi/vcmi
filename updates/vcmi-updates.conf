[service]
# nginx proxies https://updates.vcmi.eu/autoupdate.json to this address
listen = 127.0.0.1:3040
data_dir = /var/lib/vcmi-updates

[downloads]
# Local path and public URL of the download.vcmi.eu tree
download_root = /home/downloader/www
download_url = https://download.vcmi.eu

[changelog]
changelog_url = https://vcmi.eu/ChangeLog/
changelog_source = https://raw.githubusercontent.com/vcmi/vcmi/master/ChangeLog.md

[altstore]
# Deployment target of iOS builds, os.version in dependencies/conan_profiles/ios-arm64
min_os_version = 12.0
